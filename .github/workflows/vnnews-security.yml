name: vnnews-security

# Bot RIÊNG cho tin an ninh mạng: The Hacker News, BleepingComputer, Krebs,
# threat intel (Unit42, Talos) và CVE mới. Nguồn từ config.security.json.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: vnnews-security
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore seen state (security)
        uses: actions/cache/restore@v4
        with:
          path: state-security
          key: vnnews-security-seen-${{ github.run_id }}
          restore-keys: |
            vnnews-security-seen-

      - name: Poll & send (security)
        env:
          VNNEWS_CONFIG: config.security.json
          VNNEWS_BOT_TOKEN: ${{ secrets.VNNEWS_SECURITY_BOT_TOKEN }}
          VNNEWS_CHAT_ID: ${{ secrets.VNNEWS_CHAT_ID }}
          VNNEWS_STATE: ${{ github.workspace }}/state-security/seen.json
        run: |
          mkdir -p state-security
          end=$((SECONDS + 480))          # ~8 phút — phủ liên tục, gối lên nhịp cron kế
          n=0
          while [ "$SECONDS" -lt "$end" ]; do
            n=$((n + 1))
            echo "::group::cycle $n"
            python -m vnnews_bot once || echo "cycle lỗi, bỏ qua"
            echo "::endgroup::"
            [ "$SECONDS" -lt "$end" ] && sleep 45 || true
          done

      - name: Save seen state (security)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state-security
          key: vnnews-security-seen-${{ github.run_id }}
