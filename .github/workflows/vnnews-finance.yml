name: vnnews-finance

# Bot RIÊNG cho tin tài chính: Bitcoin/crypto + chứng khoán (VN & quốc tế).
# Nguồn từ config.finance.json.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: vnnews-finance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore seen state (finance)
        uses: actions/cache/restore@v4
        with:
          path: state-finance
          key: vnnews-finance-seen-${{ github.run_id }}
          restore-keys: |
            vnnews-finance-seen-

      - name: Poll & send (finance)
        env:
          VNNEWS_CONFIG: config.finance.json
          VNNEWS_BOT_TOKEN: ${{ secrets.VNNEWS_FINANCE_BOT_TOKEN }}
          VNNEWS_CHAT_ID: ${{ secrets.VNNEWS_CHAT_ID }}
          VNNEWS_STATE: ${{ github.workspace }}/state-finance/seen.json
        run: |
          mkdir -p state-finance
          end=$((SECONDS + 3000))         # ~50 phút: GitHub thực tế chỉ nổ cron ~1 lần/giờ,
                                          # run 8 phút chỉ phủ 12% thời gian → tin trễ tới 1h
          n=0
          while [ "$SECONDS" -lt "$end" ]; do
            n=$((n + 1))
            echo "::group::cycle $n"
            python -m vnnews_bot once || echo "cycle lỗi, bỏ qua"
            echo "::endgroup::"
            [ "$SECONDS" -lt "$end" ] && sleep 45 || true
          done

      - name: Save seen state (finance)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state-finance
          key: vnnews-finance-seen-${{ github.run_id }}
